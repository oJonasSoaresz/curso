<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ingressos Sarau</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/@zxing/library@0.18.6/umd/index.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Estilos base mantidos do original com ajustes */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FAF8F5; --surface: #FFFFFF; --text: #1C1815;
      --muted: #7A726A; --accent: #2D4A3E; --border: #E0DBD3;
      --radius: 12px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 2rem; }
    header { background: var(--accent); color: #fff; text-align: center; padding: 2rem 1rem; }
    header h1 { font-family: 'DM Serif Display', serif; }
    .container { max-width: 500px; margin: 0 auto; padding: 1.5rem 1rem; }

    /* Estilo do Ingresso para Impressão */
    .ticket-visual {
      position: relative;
      width: 100%;
      max-width: 350px;
      aspect-ratio: 3/4;
      margin: 20px auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .ticket-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.7;
    }
    .ticket-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.8));
    }
    .qr-container {
      background: #fff;
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
    }
    .ticket-name { font-family: 'DM Serif Display', serif; font-size: 1.5rem; margin-bottom: 5px; }
    .ticket-event { font-size: 14px; opacity: 0.9; }

    /* UI Elements */
    .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; background: #eee; }
    .tab.active { background: var(--accent); color: white; }
    .card { background: white; padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 15px; }
    .field { margin-bottom: 15px; }
    label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--muted); }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    
    .status { padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    .status-ok { background: #e6fffa; color: #2d4a3e; }
    .status-err { background: #fff5f5; color: #742a2a; }

    @media print { .no-print { display: none !important; } .ticket-visual { box-shadow: none; border: 1px solid #ddd; } }
  </style>
</head>
<body>

  <header class="no-print">
    <h1>🎭 Ingressos Sarau</h1>
    <p>Scanner & Gerador Profissional</p>
  </header>

  <div class="container">
    
    <div class="tabs no-print">
      <button class="tab active" onclick="trocarAba('gerar')">Gerar</button>
      <button class="tab" onclick="trocarAba('ler')">Validar</button>
    </div>

    <div id="panel-gerar" class="panel active">
      <div class="card no-print">
        <div class="field">
          <label>Nome do participante *</label>
          <input type="text" id="nome" placeholder="Maria Silva" oninput="validarForm()">
        </div>
        <div class="field">
          <label>Evento *</label>
          <input type="text" id="evento" placeholder="Sarau Cofo de Magia" oninput="validarForm()">
        </div>
        <button id="btn-gerar" class="btn btn-primary" onclick="gerarIngresso()" disabled>Gerar Ingresso</button>
      </div>

      <div id="qr-resultado"></div>
    </div>

    <div id="panel-ler" class="panel" style="display:none;">
      <div id="scan-resultado"></div>
      <div class="card no-print">
        <video id="video" style="width: 100%; border-radius: 8px; display: none;"></video>
        <button class="btn btn-primary" id="btn-camera" onclick="iniciarCamera()">Ligar Câmera</button>
      </div>
    </div>

  </div>

<script>
// --- ÁUDIOS ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function tocarSom(frequencia, tipo) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = tipo;
  osc.frequency.value = frequencia;
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);
}

const somSucesso = () => tocarSom(880, 'sine'); // Beep agudo
const somErro = () => tocarSom(220, 'square'); // Alerta grave

// --- CONFIG SUPABASE (Puxando do seu localStorage) ---
let sbUrl = localStorage.getItem('sb_url');
let sbKey = localStorage.getItem('sb_key');

async function sbFetch(path, opts = {}) {
  return fetch(sbUrl + '/rest/v1/' + path, {
    headers: { 'apikey': sbKey, 'Authorization': 'Bearer ' + sbKey, 'Content-Type': 'application/json', 'Prefer': opts.prefer || '' },
    method: opts.method || 'GET',
    body: opts.body || undefined
  });
}

// --- LÓGICA DE INTERFACE ---
function trocarAba(aba) {
  document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
  document.getElementById('panel-' + aba).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  if(aba !== 'ler') pararCamera();
}

function validarForm() {
  const n = document.getElementById('nome').value.trim();
  const e = document.getElementById('evento').value.trim();
  document.getElementById('btn-gerar').disabled = (n === "" || e === "");
}

async function gerarIngresso() {
  const nome = document.getElementById('nome').value;
  const evento = document.getElementById('evento').value;

  const res = await sbFetch('qrcodes', {
    method: 'POST', prefer: 'return=representation',
    body: JSON.stringify({ nome, evento, usado: false, criado_em: new Date().toISOString() })
  });

  const data = await res.json();
  const id = data[0]?.id;

  if (id) {
    // Limpar campos
    document.getElementById('nome').value = "";
    document.getElementById('evento').value = "";
    validarForm();

    // Renderizar Ingresso Bonito
    const div = document.getElementById('qr-resultado');
    div.innerHTML = `
      <div class="ticket-visual" id="print-area">
        <img src="image 4.jpg" class="ticket-bg">
        <div class="ticket-content">
          <div class="qr-container" id="qr-code-img"></div>
          <h2 class="ticket-name">${nome}</h2>
          <p class="ticket-event">${evento}</p>
          <small style="font-size:8px; opacity:0.5; margin-top:10px;">${id}</small>
        </div>
      </div>
      <button class="btn btn-primary no-print" onclick="window.print()">🖨️ Imprimir Ingresso</button>
    `;

    new QRCode(document.getElementById('qr-code-img'), {
      text: id, width: 160, height: 160, colorDark: "#000", colorLight: "#fff"
    });
  }
}

// --- CÂMERA E VALIDAÇÃO ---
let reader = null;
async function iniciarCamera() {
  reader = new ZXing.BrowserQRCodeReader();
  const video = document.getElementById('video');
  video.style.display = 'block';
  document.getElementById('btn-camera').style.display = 'none';

  reader.decodeFromVideoDevice(undefined, video, (result) => {
    if (result) validarIngresso(result.getText());
  });
}

function pararCamera() {
  if(reader) reader.reset();
  document.getElementById('video').style.display = 'none';
  document.getElementById('btn-camera').style.display = 'block';
}

async function validarIngresso(id) {
  // Evitar múltiplas leituras seguidas
  if(window.validando) return;
  window.validando = true;

  const res = await sbFetch(`qrcodes?id=eq.${id}&select=*`);
  const data = await res.json();
  const ing = data[0];

  const statusDiv = document.getElementById('scan-resultado');

  if (!ing) {
    somErro();
    statusDiv.innerHTML = `<div class="status status-err">❌ NÃO ENCONTRADO</div>`;
  } else if (ing.usado) {
    somErro();
    statusDiv.innerHTML = `<div class="status status-err">🚫 JÁ USADO POR ${ing.nome}</div>`;
  } else {
    // Marcar como usado
    await sbFetch(`qrcodes?id=eq.${id}`, {
      method: 'PATCH', body: JSON.stringify({ usado: true, usado_em: new Date().toISOString() })
    });
    somSucesso();
    statusDiv.innerHTML = `<div class="status status-ok">✅ LIBERADO: ${ing.nome}</div>`;
  }

  setTimeout(() => { 
    statusDiv.innerHTML = ""; 
    window.validando = false; 
  }, 3000);
}
</script>
</body>
</html>
