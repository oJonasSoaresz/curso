<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingressos Sarau — QR Code</title>

  <!-- Bibliotecas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #FAF8F5;
      --surface: #FFFFFF;
      --surface2: #F2EFE9;
      --border: #E0DBD3;
      --text: #1C1815;
      --muted: #7A726A;
      --accent: #2D4A3E;
      --accent-light: #EBF2EE;
      --danger: #7A1F1F;
      --danger-light: #FCEAEA;
      --warn-light: #FDF5E6;
      --warn: #7A5A10;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    header {
      background: var(--accent);
      color: #fff;
      text-align: center;
      padding: 2rem 1rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: -40px; left: -40px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    header::after {
      content: '';
      position: absolute;
      bottom: -60px; right: -20px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }

    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      position: relative;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.7;
      margin-top: 4px;
      position: relative;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    /* CONFIG */
    .config-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      margin-bottom: 1.25rem;
      font-family: 'DM Sans', sans-serif;
    }

    .config-toggle:hover { background: var(--surface2); }

    .config-panel {
      display: none;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .config-panel.open { display: block; }

    /* TABS */
    .tabs {
      display: flex;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 4px;
      gap: 4px;
      margin-bottom: 1.25rem;
    }

    .tab {
      flex: 1;
      padding: 9px 6px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      border: none;
      background: none;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.18s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
    }

    .tab svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* PANEL */
    .panel { display: none; }
    .panel.active { display: block; }

    /* CARD */
    .card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    /* FORM */
    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--accent); }

    /* BUTTONS */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.98); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 0.5px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .btn-sm {
      width: auto;
      padding: 7px 14px;
      font-size: 12px;
    }

    /* QR RESULTADO */
    .qr-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    .qr-box #qr-canvas img,
    .qr-box #qr-canvas canvas {
      border-radius: 6px;
    }

    .ingresso-nome {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      color: var(--text);
    }

    .ingresso-evento {
      font-size: 13px;
      color: var(--muted);
    }

    .ingresso-id {
      font-size: 10px;
      color: var(--border);
      font-family: monospace;
      word-break: break-all;
    }

    .divider {
      width: 100%;
      height: 0.5px;
      background: var(--border);
      margin: 8px 0;
    }

    /* CÂMERA */
    #video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius);
      overflow: hidden;
      background: #111;
      margin-bottom: 1rem;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scan-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scan-frame {
      width: 200px;
      height: 200px;
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 12px;
      position: relative;
    }

    .scan-frame::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: #fff;
      animation: scanline 1.8s linear infinite;
    }

    @keyframes scanline {
      0%   { top: 0%; opacity: 1; }
      50%  { top: 95%; opacity: 1; }
      100% { top: 0%; opacity: 0; }
    }

    /* STATUS CARDS */
    .status {
      border-radius: var(--radius-sm);
      padding: 1rem 1.25rem;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 1rem;
    }

    .status small {
      display: block;
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
      opacity: 0.8;
    }

    .status-ok    { background: var(--accent-light); color: var(--accent); }
    .status-err   { background: var(--danger-light); color: var(--danger); }
    .status-warn  { background: var(--warn-light);   color: var(--warn); }

    /* LISTA */
    .resumo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1rem;
    }

    .resumo-card {
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
    }

    .resumo-card .num {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      color: var(--text);
    }

    .resumo-card .leg {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .resumo-card.ok .num  { color: var(--accent); }
    .resumo-card.ok       { background: var(--accent-light); }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 0.5px solid var(--border);
      gap: 8px;
    }

    .list-item:last-child { border-bottom: none; }

    .list-item-info { flex: 1; min-width: 0; }

    .list-item-nome {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-item-sub {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 99px;
      flex-shrink: 0;
    }

    .badge-ok  { background: var(--accent-light); color: var(--accent); }
    .badge-err { background: var(--danger-light); color: var(--danger); }

    /* CONFIG STATUS */
    .cfg-ok  { font-size: 12px; color: var(--accent); margin-top: 8px; }
    .cfg-err { font-size: 12px; color: var(--danger); margin-top: 8px; }

    /* PRINT BUTTON */
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .qr-box { border: 1px solid #ddd; break-inside: avoid; }
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 2rem 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎭 Ingressos Sarau</h1>
    <p>Gere e valide ingressos com QR Code único</p>
  </header>

  <div class="container">

    <!-- CONFIGURAÇÃO SUPABASE -->
    <button class="config-toggle no-print" onclick="toggleConfig()">
      ⚙️ Configurar Supabase
    </button>

    <div class="config-panel" id="config-panel">
      <div class="field">
        <label>URL do projeto Supabase</label>
        <input type="text" id="sb-url" placeholder="https://xxxxxxxxxxx.supabase.co" />
      </div>
      <div class="field">
        <label>Anon Key (chave pública)</label>
        <input type="password" id="sb-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." />
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="salvarConfig()">Salvar</button>
      <p id="config-msg"></p>
    </div>

    <!-- ABAS -->
    <div class="tabs no-print">
      <button class="tab active" id="tab-gerar" onclick="trocarAba('gerar')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3m0 4h4m-4-4v4m0 0h-3"/></svg>
        Gerar
      </button>
      <button class="tab" id="tab-ler" onclick="trocarAba('ler')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        Validar
      </button>
      <button class="tab" id="tab-lista" onclick="trocarAba('lista')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>
        Registros
      </button>
    </div>

    <!-- PAINEL: GERAR -->
    <div class="panel active" id="panel-gerar">
      <div class="card no-print">
        <div class="field">
          <label>Nome do participante</label>
          <input type="text" id="nome" placeholder="Ex: Maria da Silva" />
        </div>
        <div class="field">
          <label>Nome do evento</label>
          <input type="text" id="evento" placeholder="Ex: Sarau Cofo de Magia" />
        </div>
        <div class="field">
          <label>Lote / Observação (opcional)</label>
          <input type="text" id="lote" placeholder="Ex: Lote 1 · Meia entrada" />
        </div>
        <button class="btn btn-primary" style="margin-top:4px;" onclick="gerarIngresso()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          Gerar ingresso
        </button>
      </div>

      <div id="qr-resultado"></div>
    </div>

    <!-- PAINEL: LER / VALIDAR -->
    <div class="panel" id="panel-ler">
      <div id="scan-resultado"></div>

      <div class="card">
        <div id="video-container" style="display:none;">
          <video id="video" playsinline autoplay muted></video>
          <div class="scan-overlay">
            <div class="scan-frame"></div>
          </div>
        </div>

        <button class="btn btn-primary" id="btn-camera" onclick="iniciarCamera()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Ligar câmera
        </button>

        <button class="btn btn-secondary" id="btn-parar" style="display:none; margin-top:8px;" onclick="pararCamera()">
          Desligar câmera
        </button>

        <p id="scan-debug" style="font-size:12px; color:var(--muted); margin-top:10px; text-align:center; min-height:18px;">
          Aponte a câmera para o QR Code — a validação é automática.
        </p>
      </div>

      <!-- Validação manual por ID -->
      <div class="card" style="margin-top:0;">
        <p style="font-size:12px; color:var(--muted); margin-bottom:10px; font-weight:500;">Ou digite o ID manualmente:</p>
        <div style="display:flex; gap:8px;">
          <input type="text" id="id-manual" placeholder="UUID do ingresso" style="flex:1;" />
          <button class="btn btn-secondary btn-sm" onclick="validarManual()">Validar</button>
        </div>
      </div>
    </div>

    <!-- PAINEL: LISTA -->
    <div class="panel" id="panel-lista">
      <div id="resumo-area"></div>
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
          <span style="font-size:14px; font-weight:500;">Ingressos gerados</span>
          <button class="btn btn-secondary btn-sm" onclick="carregarLista()">↻ Atualizar</button>
        </div>
        <div id="lista-conteudo">
          <p class="empty">Clique em "Atualizar" para carregar os registros.</p>
        </div>
      </div>
    </div>

  </div><!-- /container -->

<script>
// ─── CONFIG ──────────────────────────────────────────────
let sbUrl = localStorage.getItem('sb_url') || '';
let sbKey = localStorage.getItem('sb_key') || '';

if (sbUrl) document.getElementById('sb-url').value = sbUrl;
if (sbKey) document.getElementById('sb-key').value = sbKey;

function toggleConfig() {
  document.getElementById('config-panel').classList.toggle('open');
}

function salvarConfig() {
  sbUrl = document.getElementById('sb-url').value.trim().replace(/\/$/, '');
  sbKey = document.getElementById('sb-key').value.trim();
  const msg = document.getElementById('config-msg');
  if (!sbUrl || !sbKey) {
    msg.textContent = '⚠️ Preencha os dois campos.';
    msg.className = 'cfg-err';
    return;
  }
  localStorage.setItem('sb_url', sbUrl);
  localStorage.setItem('sb_key', sbKey);
  msg.textContent = '✓ Configuração salva!';
  msg.className = 'cfg-ok';
  setTimeout(() => document.getElementById('config-panel').classList.remove('open'), 1200);
}

// ─── SUPABASE FETCH ──────────────────────────────────────
async function sbFetch(path, opts = {}) {
  if (!sbUrl || !sbKey) {
    alert('Configure o Supabase primeiro — clique em "⚙️ Configurar Supabase".');
    return null;
  }
  try {
    const res = await fetch(sbUrl + '/rest/v1/' + path, {
      headers: {
        'apikey': sbKey,
        'Authorization': 'Bearer ' + sbKey,
        'Content-Type': 'application/json',
        'Prefer': opts.prefer || 'return=representation'
      },
      method: opts.method || 'GET',
      body: opts.body || undefined
    });
    return res;
  } catch (e) {
    alert('Erro de rede: ' + e.message);
    return null;
  }
}

// ─── ABAS ────────────────────────────────────────────────
function trocarAba(aba) {
  ['gerar','ler','lista'].forEach(a => {
    document.getElementById('tab-' + a).classList.toggle('active', a === aba);
    document.getElementById('panel-' + a).classList.toggle('active', a === aba);
  });
  if (aba !== 'ler') pararCamera();
  if (aba === 'lista') carregarLista();
}

// ─── GERAR INGRESSO ──────────────────────────────────────
async function gerarIngresso() {
  const nome  = document.getElementById('nome').value.trim();
  const evento = document.getElementById('evento').value.trim();
  const lote  = document.getElementById('lote').value.trim();

  if (!nome || !evento) {
    alert('Preencha ao menos o nome do participante e o nome do evento.');
    return;
  }

  const payload = { nome, evento, lote, usado: false, criado_em: new Date().toISOString() };
  const res = await sbFetch('qrcodes', {
    method: 'POST',
    prefer: 'return=representation',
    body: JSON.stringify(payload)
  });
  if (!res) return;

  const data = await res.json();
  if (!res.ok) { alert('Erro ao salvar: ' + JSON.stringify(data)); return; }

  const id = data[0]?.id;
  if (!id) { alert('Resposta inesperada do Supabase.'); return; }

  const div = document.getElementById('qr-resultado');
  div.innerHTML = `
    <div class="qr-box" id="qr-box-print">
      <div id="qr-canvas"></div>
      <div class="divider"></div>
      <p class="ingresso-nome">${escapar(nome)}</p>
      <p class="ingresso-evento">${escapar(evento)}${lote ? ' · ' + escapar(lote) : ''}</p>
      <p class="ingresso-id">${id}</p>
      <div class="divider"></div>
      <p style="font-size:11px; color:var(--muted);">Este ingresso é válido para uma única entrada.</p>
    </div>
    <div style="display:flex; gap:8px;" class="no-print">
      <button class="btn btn-secondary" style="flex:1;" onclick="window.print()">🖨️ Imprimir</button>
      <button class="btn btn-primary" style="flex:1;" onclick="compartilharQR('${id}', '${escaparJs(nome)}', '${escaparJs(evento)}')">📤 Compartilhar</button>
    </div>
  `;

  new QRCode(document.getElementById('qr-canvas'), {
    text: id,
    width: 200,
    height: 200,
    colorDark: '#2D4A3E',
    colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.H
  });
}

function escapar(str) { return String(str).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escaparJs(str) { return String(str).replace(/'/g,"\\'"); }

async function compartilharQR(id, nome, evento) {
  const texto = `Ingresso: ${nome}\nEvento: ${evento}\nID: ${id}`;
  if (navigator.share) {
    try { await navigator.share({ title: 'Ingresso ' + evento, text: texto }); } catch(e) {}
  } else {
    navigator.clipboard.writeText(texto).then(() => alert('Informações copiadas!'));
  }
}

// ─── CÂMERA / LEITURA ────────────────────────────────────
let stream = null, scanInterval = null, ultimoId = '', bloqueado = false;
const scanCanvas = document.createElement('canvas');
const scanCtx = scanCanvas.getContext('2d');

function logDebug(msg) {
  const el = document.getElementById('scan-debug');
  if (el) el.textContent = msg;
}

async function iniciarCamera() {
  const video = document.getElementById('video');

  // tenta câmera traseira primeiro, depois qualquer câmera
  const constraints = [
    { video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { facingMode: 'environment' } },
    { video: true }
  ];

  let ok = false;
  for (const c of constraints) {
    try {
      stream = await navigator.mediaDevices.getUserMedia(c);
      ok = true;
      break;
    } catch(e) { /* tenta o próximo */ }
  }

  if (!ok) {
    alert('Não foi possível acessar a câmera.\nVerifique as permissões no navegador e tente novamente.');
    return;
  }

  video.srcObject = stream;

  // espera o vídeo estar pronto de verdade
  video.onloadedmetadata = () => {
    video.play().then(() => {
      document.getElementById('video-container').style.display = 'block';
      document.getElementById('btn-camera').style.display = 'none';
      document.getElementById('btn-parar').style.display = 'flex';
      logDebug('Câmera ativa — aponte para o QR Code');
      iniciarScan(video);
    }).catch(e => alert('Erro ao iniciar vídeo: ' + e.message));
  };
}

function iniciarScan(video) {
  if (scanInterval) clearInterval(scanInterval);

  scanInterval = setInterval(() => {
    if (bloqueado) return;
    if (video.readyState < 2 || video.videoWidth === 0) {
      logDebug('Aguardando vídeo...');
      return;
    }

    scanCanvas.width  = video.videoWidth;
    scanCanvas.height = video.videoHeight;
    scanCtx.drawImage(video, 0, 0, scanCanvas.width, scanCanvas.height);

    let imgData;
    try {
      imgData = scanCtx.getImageData(0, 0, scanCanvas.width, scanCanvas.height);
    } catch(e) { return; }

    const code = jsQR(imgData.data, imgData.width, imgData.height, {
      inversionAttempts: 'dontInvert'
    });

    if (code && code.data) {
      if (code.data !== ultimoId) {
        ultimoId = code.data;
        logDebug('QR detectado!');
        validarIngresso(code.data);
      }
    } else {
      logDebug('Procurando QR Code...');
    }
  }, 250); // verifica 4x por segundo
}

function pararCamera() {
  if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  ultimoId = '';
  bloqueado = false;
  document.getElementById('video-container').style.display = 'none';
  document.getElementById('btn-camera').style.display = 'flex';
  document.getElementById('btn-parar').style.display = 'none';
  logDebug('');
}

function validarManual() {
  const id = document.getElementById('id-manual').value.trim();
  if (!id) { alert('Digite o ID do ingresso.'); return; }
  validarIngresso(id);
}

async function validarIngresso(id) {
  bloqueado = true;
  mostrarStatus('warn', 'Verificando ingresso...', '');

  const res = await sbFetch('qrcodes?id=eq.' + encodeURIComponent(id) + '&select=*');
  if (!res) { bloqueado = false; return; }
  const data = await res.json();

  if (!res.ok || !data || !data.length) {
    mostrarStatus('err', '❌ Ingresso não encontrado.', 'Este QR Code não existe no sistema.');
    setTimeout(liberar, 4000); return;
  }

  const ing = data[0];

  if (ing.usado) {
    const dt = ing.usado_em ? new Date(ing.usado_em).toLocaleString('pt-BR') : 'data desconhecida';
    mostrarStatus('err', '🚫 Ingresso já utilizado', `Entrada registrada em ${dt} · ${ing.nome}`);
    setTimeout(liberar, 5000); return;
  }

  // Marcar como usado
  const upd = await sbFetch('qrcodes?id=eq.' + encodeURIComponent(id), {
    method: 'PATCH',
    prefer: 'return=representation',
    body: JSON.stringify({ usado: true, usado_em: new Date().toISOString() })
  });

  if (upd && upd.ok) {
    mostrarStatus('ok',
      '✅ Entrada liberada!',
      `${ing.nome} · ${ing.evento}${ing.lote ? ' · ' + ing.lote : ''}`
    );
  } else {
    mostrarStatus('err', 'Erro ao registrar uso.', 'Tente novamente.');
  }

  setTimeout(liberar, 5000);
}

function mostrarStatus(tipo, msg, sub) {
  const div = document.getElementById('scan-resultado');
  div.innerHTML = `<div class="status status-${tipo}">${msg}${sub ? `<small>${sub}</small>` : ''}</div>`;
}

function liberar() {
  bloqueado = false;
  ultimoId = '';
  logDebug('Procurando QR Code...');
}

// ─── LISTA ───────────────────────────────────────────────
async function carregarLista() {
  document.getElementById('lista-conteudo').innerHTML = '<p class="empty">Carregando...</p>';
  const res = await sbFetch('qrcodes?select=*&order=criado_em.desc&limit=100');
  if (!res) return;
  const data = await res.json();

  if (!res.ok) { document.getElementById('lista-conteudo').innerHTML = '<p class="empty">Erro ao carregar.</p>'; return; }
  if (!data || !data.length) { document.getElementById('lista-conteudo').innerHTML = '<p class="empty">Nenhum ingresso gerado ainda.</p>'; document.getElementById('resumo-area').innerHTML = ''; return; }

  const total   = data.length;
  const usados  = data.filter(d => d.usado).length;
  const livres  = total - usados;

  document.getElementById('resumo-area').innerHTML = `
    <div class="resumo-grid">
      <div class="resumo-card"><div class="num">${total}</div><div class="leg">Total</div></div>
      <div class="resumo-card ok"><div class="num">${usados}</div><div class="leg">Validados</div></div>
      <div class="resumo-card"><div class="num">${livres}</div><div class="leg">Pendentes</div></div>
    </div>
  `;

  document.getElementById('lista-conteudo').innerHTML = data.map(d => `
    <div class="list-item">
      <div class="list-item-info">
        <div class="list-item-nome">${escapar(d.nome)}</div>
        <div class="list-item-sub">${escapar(d.evento)}${d.lote ? ' · ' + escapar(d.lote) : ''}</div>
      </div>
      <span class="badge ${d.usado ? 'badge-err' : 'badge-ok'}">${d.usado ? 'Usado' : 'Válido'}</span>
    </div>
  `).join('');
}
</script>
